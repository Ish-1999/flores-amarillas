<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8d8">
  <meta name="description" content="Un jardín de flores amarillas para ti. Recoge una flor y descubre un mensaje bonito.">
  <title>Flores amarillas para ti 💛</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🌼%3C/text%3E%3C/svg%3E">
  <style>:root{color-scheme:light;--ink:#324329;--quiet:#657044;--gold:#e4ac12;--paper:#fff8d8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit}
button:focus-visible{outline:3px solid #587334;outline-offset:5px}
.garden-page{position:relative;min-height:780px;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 13%,#fffdf0 0%,#fff8db 42%,transparent 72%),linear-gradient(180deg,#fff8d9 15%,#f4f1ca 63%,#cfd6a1 100%)}
.garden-page:after{content:"";position:absolute;z-index:-1;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' opacity='.045' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");opacity:.45;pointer-events:none}
.topbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:28px 40px;min-height:80px}
.wordmark{font-size:12px;font-weight:600;letter-spacing:2px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.wordmark>span{font-size:25px;line-height:1;color:#9c7613;font-weight:400}
.replant{border:1px solid #71804655;background:#fffbedb8;padding:10px 15px;border-radius:30px;font-size:14px;color:var(--ink);cursor:pointer;transition:background .2s}
.replant:hover{background:#fffef3}
.replant span{font-size:18px;padding-right:4px}
[hidden]{display:none!important}
.dedication{position:relative;z-index:10;text-align:center;width:min(90%,650px);margin:27px auto 0;pointer-events:none}
.little-note{font-size:12px;letter-spacing:2.4px;line-height:1.6;color:#69714e}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(64px,7vw,104px);line-height:.98;letter-spacing:-4px;margin:22px 0 24px}
h1 em{font-weight:400;color:#9b7715}
.intro{font-size:16px;line-height:1.6;margin:0;color:#626b43}
.message-space{min-height:94px;display:flex;justify-content:center;align-items:center}
.message{font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,3.2vw,38px);line-height:1.3;margin:15px 0 0;font-style:italic;color:#435630}
.initial-message{font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:.1px;font-style:normal;color:#6b7252}
.initial-message span{font-size:20px;vertical-align:-2px;margin-left:4px}
.message.reveal{animation:message-in .5s ease both}
.garden{position:absolute;inset:0;z-index:4;pointer-events:none}
.plant{position:absolute;width:var(--size);height:calc(var(--size)*1.5);left:var(--x);bottom:var(--bottom);margin-left:calc(var(--size)*-.5);transform-origin:50% 96%;pointer-events:none;animation:sway var(--duration) ease-in-out var(--delay) infinite alternate;z-index:var(--depth)}
.flower-visual{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;transform:rotate(var(--lean));transform-origin:50% 97%;filter:var(--tint);transition:filter .25s}
.flower-pick{position:absolute;top:2%;left:10%;width:80%;height:43%;border:0;border-radius:50%;background:transparent;cursor:grab;pointer-events:auto;touch-action:none;z-index:2;min-width:44px;min-height:44px}
.flower-pick:active{cursor:grabbing}
.plant:has(.flower-pick:hover) .flower-visual,.plant:has(.flower-pick:focus-visible) .flower-visual{filter:var(--tint) drop-shadow(0 0 9px #fff7b9)}
.plant.picked{animation:none}
.plant.picked .flower-visual{animation:pluck .75s cubic-bezier(.2,.7,.25,1) both}
.plant.picked .flower-pick{pointer-events:none;visibility:hidden}
.plant.growing .flower-visual{animation:grow .8s cubic-bezier(.2,.8,.3,1.1) both}
.sparkles{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.spark{position:absolute;color:var(--c);font-size:var(--s);animation:sparkle 1.2s ease-out forwards;transform:translate(-50%,-50%);line-height:1}
.floating-note{position:absolute;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-style:italic;white-space:nowrap;color:#40502b;text-shadow:0 1px 8px #fffbe0;animation:float-note 1.9s ease-out both;transform:translateX(-50%)}
.footer{position:absolute;z-index:18;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;padding:38px 16px max(22px,env(safe-area-inset-bottom));font-size:14px;line-height:1.5;color:#34442c;background:linear-gradient(transparent,#e8ebc7e8 65%);pointer-events:none;text-align:center}
.touch-symbol{font-size:21px}
.no-script{position:absolute;z-index:40;bottom:20%;left:10%;right:10%;background:var(--paper);padding:20px;border-radius:12px;text-align:center}
@keyframes sway{from{transform:rotate(calc(var(--sway)*-1))}to{transform:rotate(var(--sway))}}
@keyframes pluck{0%{transform:translateY(0) rotate(var(--lean));opacity:1}30%{transform:translateY(-35px) rotate(-9deg);opacity:1}100%{transform:translateY(-145px) rotate(17deg) scale(.7);opacity:0}}
@keyframes grow{from{opacity:0;transform:scale(.2) rotate(var(--lean))}to{opacity:1;transform:scale(1) rotate(var(--lean))}}
@keyframes message-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes sparkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(80deg) scale(.6)}}
@keyframes float-note{0%{opacity:0;translate:0 0}20%{opacity:1}75%{opacity:1}100%{opacity:0;translate:0 -90px}}
@media(min-width:1500px){.dedication{margin-top:55px}.garden-page{min-height:860px}}
@media(max-width:650px){.garden-page{min-height:690px}.topbar{padding:18px 20px;min-height:66px;gap:8px}.wordmark{font-size:10px;letter-spacing:1.5px;gap:6px}.wordmark>span{font-size:22px}.replant{font-size:12px;padding:8px 10px}.replant span{font-size:15px}.dedication{margin-top:30px;width:94%}.little-note{font-size:10px;letter-spacing:1.7px}h1{font-size:68px;letter-spacing:-3px;margin:20px 0}.intro{font-size:15px}.message-space{min-height:82px}.message{font-size:30px}.initial-message{font-size:13px}.footer{font-size:13px;padding-top:35px}.floating-note{font-size:18px}}
@media(max-width:360px){.wordmark{font-size:9px;letter-spacing:1px}.topbar{padding-inline:13px}h1{font-size:62px}.intro{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.plant.picked .flower-visual{opacity:0}.spark,.floating-note{display:none}}
</style>
</head>
<body>
  <main class="garden-page">
    <header class="topbar">
      <span class="wordmark"><span aria-hidden="true">✳</span> FLORES AMARILLAS</span>
      <button class="replant" id="replant" type="button" hidden><span aria-hidden="true">↻</span> Volver a florecer</button>
    </header>

    <section class="dedication" aria-label="Un regalo para ti">
      <div class="little-note">UN DETALLITO, SOLO PORQUE SÍ</div>
      <h1>Un jardín<br><em>para ti.</em></h1>
      <p class="intro">Hay una cosita linda en cada flor.</p>
      <div class="message-space">
        <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"><span class="initial-message">Elige la que más te guste <span aria-hidden="true">♡</span></span></p>
      </div>
    </section>

    <div class="garden" id="garden" role="group" aria-label="Jardín de flores amarillas. Toca o arrastra una flor hacia arriba para recogerla."></div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <footer class="footer"><span class="touch-symbol" aria-hidden="true">✧</span><span>Toca una flor. Este jardín es tuyo.</span></footer>
    <noscript><p class="no-script">Activa JavaScript para recoger tus flores. Mientras tanto: Tqm ❤️</p></noscript>
  </main>
  <script>(() => {

        image.draggable = false;
        image.width = 400;
        image.height = 600;
        const button = document.createElement('button');
        button.className = 'flower-pick';
        button.type = 'button';
        button.setAttribute('aria-label', 'Recoger flor ' + (++number));
        plant.append(image, button);
        garden.append(plant);
        let startY = null;
        button.addEventListener('pointerdown', event => {
          startY = event.clientY;
          button.setPointerCapture(event.pointerId);
        });
        button.addEventListener('pointermove', event => {
          if (startY !== null && startY - event.clientY > 22) {
            pick(plant, button);
            startY = null;
          }
        });
        button.addEventListener('pointerup', () => { startY = null; });
        button.addEventListener('pointercancel', () => { startY = null; });
        button.addEventListener('click', () => pick(plant, button));
      }
    });
  }

  function grow(plant, button) {
    clearTimeout(timers.get(plant));
    timers.delete(plant);
    plant.classList.remove('picked');
    plant.classList.add('growing');
    button.removeAttribute('aria-disabled');
    setTimeout(() => plant.classList.remove('growing'), 850);
  }

  function pick(plant, button) {
    if (plant.classList.contains('picked')) return;
    const rect = button.getBoundingClientRect();
    const parent = garden.getBoundingClientRect();
    const x = Math.max(85, Math.min(parent.width - 85, rect.left + rect.width / 2));
    const y = rect.top - parent.top + rect.height / 2;
    const phrase = phrases[pickedCount % phrases.length];
    pickedCount++;
    if (button.matches(':focus-visible')) {
      const next = [...garden.querySelectorAll('.flower-pick')].find(el => el !== button && el.getAttribute('aria-disabled') !== 'true');
      (next || replant).focus({preventScroll:true});
    }
    plant.classList.remove('growing');
    plant.classList.add('picked');
    button.setAttribute('aria-disabled', 'true');
    replant.hidden = false;
    message.textContent = phrase;
    message.classList.remove('reveal');
    void message.offsetWidth;
    message.classList.add('reveal');
    const note = document.createElement('span');
    note.className = 'floating-note';
    note.textContent = pickedCount % 2 ? 'para ti ♡' : 'con cariño ♡';
    note.style.left = x + 'px';
    note.style.top = (y - 20) + 'px';
    sparkles.append(note);
    setTimeout(() => note.remove(), 2000);
    for (let i = 0; i < 9; i++) {
      const spark = document.createElement('span');
      spark.className = 'spark';
      spark.textContent = i % 3 ? '✦' : '♡';
      spark.style.left = x + 'px';
      spark.style.top = y + 'px';
      spark.style.setProperty('--dx', (Math.random() - .5) * 140 + 'px');
      spark.style.setProperty('--dy', (-30 - Math.random() * 100) + 'px');
      spark.style.setProperty('--s', (10 + Math.random() * 13) + 'px');
      spark.style.setProperty('--c', i % 3 ? '#c69714' : '#83934b');
      sparkles.append(spark);
      setTimeout(() => spark.remove(), 1300);
    }
    timers.set(plant, setTimeout(() => grow(plant, button), 11000));
  }

  replant.addEventListener('click', () => {
    garden.querySelectorAll('.picked').forEach(plant => grow(plant, plant.querySelector('button')));
    message.textContent = 'Más flores, más cariño 💛';
  });
  window.matchMedia('(max-width: 650px)').addEventListener('change', event => {
    mobile = event.matches;
    plantGarden();
  });
  plantGarden();
})();
</script>
